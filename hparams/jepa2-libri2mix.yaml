# Source-predictive SepFormer for blind two-speaker Libri2Mix separation.
# The clean-source encoder and predictor are training-only modules.

seed: 1234
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]

data_folder: /project/anhlt/LibriMix/Libri2Mix
base_folder_dm: /project/anhlt/LibriMix/LibriSpeech/train-clean-100/

# Ablation switches (override from CLI, e.g. --seq_model=transformer --jepa_mode=none)
#   seq_model: transformer | mamba
#   jepa_mode: none | pointwise (v1) | masked (v2)
seq_model: mamba
jepa_mode: masked
# JEPA head (context encoder, EMA target, predictor) is training-only and
# discarded at inference; it is kept fixed across backbones for a fair ablation.
jepa_head_model: mamba
experiment_name: !ref jepa2-<seq_model>-<jepa_mode>-libri2mix
output_folder: !ref results/<experiment_name>-train100/<seed>
train_log: !ref <output_folder>/train_log.txt
save_folder: !ref <output_folder>/save
train_data: !ref <save_folder>/libri2mix_train-100.csv
valid_data: !ref <save_folder>/libri2mix_dev.csv
test_data: !ref <save_folder>/libri2mix_test.csv
skip_prep: False
ckpt_interval_minutes: 60

precision: fp16
num_spks: 2
noprogressbar: False
save_audio: False
sample_rate: 8000

N_epochs: 200
batch_size: 2
lr: 0.00015
clip_grad_norm: 5
loss_upper_lim: 999999
limit_training_signal_len: True
training_signal_len: 72000

dynamic_mixing: False
use_wham_noise: False
use_wavedrop: False
use_speedperturb: True
use_rand_shift: False
min_shift: -8000
max_shift: 8000
speed_changes: [95, 100, 105]

speed_perturb: !new:speechbrain.augment.time_domain.SpeedPerturb
    orig_freq: !ref <sample_rate>
    speeds: !ref <speed_changes>

drop_freq_low: 0
drop_freq_high: 1
drop_freq_count_low: 1
drop_freq_count_high: 3
drop_freq_width: 0.05

drop_freq: !new:speechbrain.augment.time_domain.DropFreq
    drop_freq_low: !ref <drop_freq_low>
    drop_freq_high: !ref <drop_freq_high>
    drop_freq_count_low: !ref <drop_freq_count_low>
    drop_freq_count_high: !ref <drop_freq_count_high>
    drop_freq_width: !ref <drop_freq_width>

drop_chunk_count_low: 1
drop_chunk_count_high: 5
drop_chunk_length_low: 1000
drop_chunk_length_high: 2000

drop_chunk: !new:speechbrain.augment.time_domain.DropChunk
    drop_length_low: !ref <drop_chunk_length_low>
    drop_length_high: !ref <drop_chunk_length_high>
    drop_count_low: !ref <drop_chunk_count_low>
    drop_count_high: !ref <drop_chunk_count_high>

threshold_byloss: True
threshold: -30

N_encoder_out: 256
out_channels: 256
kernel_size: 16
kernel_stride: 8
d_ffn: 1024
predictor_hidden_channels: 256
source_prediction_weight: 0.1
sep_layers: 8
# EMA: cosine schedule from start to end over ema_anneal_steps optimizer steps
target_encoder_momentum: 0.996
target_encoder_momentum_end: 1.0
ema_anneal_steps: 2800000  # ~ N_epochs * (13900 / batch_size) for train-100
# JEPA v2 (masked) settings
context_layers: 2
predictor_dim: 128
predictor_layers: 2
mask_ratio: 0.5
mask_span: 10  # latent frames; 10 frames * 8 samples = 10 ms @ 8 kHz
visible_loss_weight: 0.0
health_interval: 200

dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: 0

Encoder: !new:speechbrain.lobes.models.dual_path.Encoder
    kernel_size: !ref <kernel_size>
    out_channels: !ref <N_encoder_out>

TargetEncoder: !new:speechbrain.lobes.models.dual_path.Encoder
    kernel_size: !ref <kernel_size>
    out_channels: !ref <N_encoder_out>

SBtfintra: !apply:models.build_sequence_model
    kind: !ref <seq_model>
    num_layers: !ref <sep_layers>
    d_model: !ref <out_channels>
    d_ffn: !ref <d_ffn>

SBtfinter: !apply:models.build_sequence_model
    kind: !ref <seq_model>
    num_layers: !ref <sep_layers>
    d_model: !ref <out_channels>
    d_ffn: !ref <d_ffn>

MaskNet: !new:speechbrain.lobes.models.dual_path.Dual_Path_Model
    num_spks: !ref <num_spks>
    in_channels: !ref <N_encoder_out>
    out_channels: !ref <out_channels>
    num_layers: 2
    K: 250
    intra_model: !ref <SBtfintra>
    inter_model: !ref <SBtfinter>
    norm: ln
    linear_layer_after_inter_intra: False
    skip_around_intra: True

Decoder: !new:speechbrain.lobes.models.dual_path.Decoder
    in_channels: !ref <N_encoder_out>
    out_channels: 1
    kernel_size: !ref <kernel_size>
    stride: !ref <kernel_stride>
    bias: False

SourcePredictor: !new:models.SourceLatentPredictor
    channels: !ref <N_encoder_out>
    hidden_channels: !ref <predictor_hidden_channels>

source_prediction_loss: !new:models.NormalizedSourcePredictionLoss

ContextEncoder: !new:models.SequenceContextEncoder
    sequence_model: !apply:models.build_sequence_model
        kind: !ref <jepa_head_model>
        num_layers: !ref <context_layers>
        d_model: !ref <N_encoder_out>
        d_ffn: !ref <d_ffn>

TargetContextEncoder: !new:models.SequenceContextEncoder
    sequence_model: !apply:models.build_sequence_model
        kind: !ref <jepa_head_model>
        num_layers: !ref <context_layers>
        d_model: !ref <N_encoder_out>
        d_ffn: !ref <d_ffn>

SpanPredictor: !new:models.MaskedSpanPredictor
    channels: !ref <N_encoder_out>
    predictor_dim: !ref <predictor_dim>
    sequence_model: !apply:models.build_sequence_model
        kind: !ref <jepa_head_model>
        num_layers: !ref <predictor_layers>
        d_model: !ref <predictor_dim>
        d_ffn: 512
        nhead: 4

masked_prediction_loss: !new:models.MaskedLatentPredictionLoss
    kind: l2

optimizer: !name:torch.optim.Adam
    lr: !ref <lr>
    weight_decay: 0

loss: !name:speechbrain.nnet.losses.get_si_snr_with_pitwrapper

lr_scheduler: !new:speechbrain.nnet.schedulers.ReduceLROnPlateau
    factor: 0.5
    patience: 2
    dont_halve_until_epoch: 5

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <N_epochs>

modules:
    encoder: !ref <Encoder>
    decoder: !ref <Decoder>
    masknet: !ref <MaskNet>
    source_predictor: !ref <SourcePredictor>
    target_encoder: !ref <TargetEncoder>
    context_encoder: !ref <ContextEncoder>
    target_context_encoder: !ref <TargetContextEncoder>
    span_predictor: !ref <SpanPredictor>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        encoder: !ref <Encoder>
        decoder: !ref <Decoder>
        masknet: !ref <MaskNet>
        source_predictor: !ref <SourcePredictor>
        target_encoder: !ref <TargetEncoder>
        context_encoder: !ref <ContextEncoder>
        target_context_encoder: !ref <TargetContextEncoder>
        span_predictor: !ref <SpanPredictor>
        lr_scheduler: !ref <lr_scheduler>
        counter: !ref <epoch_counter>

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

# All separator modules are initialized from scratch for this experiment.
